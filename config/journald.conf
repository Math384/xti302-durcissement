# /etc/systemd/journald.conf.d/xti302.conf - Exigence J3 (copié par installer.sh)
[Journal]
# Journal écrit sur disque (/var/log/journal) : il survit aux redémarrages.
# Avec la valeur par défaut "auto", il reste en mémoire (/run) si /var/log/journal n'existe pas.
Storage=persistent
# Au plus 200 Mo sur le disque, et 3 mois d'historique (choix justifiés dans le dossier)
SystemMaxUse=200M
MaxRetentionSec=3month
