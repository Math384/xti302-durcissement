# /etc/ssh/sshd_config.d/00-xti302.conf - Exigences S1 à S5 (copié par installer.sh)
#
# sshd_config inclut sshd_config.d/*.conf tout en haut, et pour chaque option
# c'est la PREMIÈRE valeur lue qui s'applique. Le préfixe "00-" place ce fichier
# en tête : ses valeurs l'emportent sur celles de sshd_config et des autres fichiers.

# --- S1 : authentification par clé uniquement --------------------------------
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
AuthenticationMethods publickey

# --- S2 : connexion de root interdite -----------------------------------------
PermitRootLogin no

# --- S3 : seuls les membres de acces_ssh peuvent se connecter -----------------
AllowGroups acces_ssh

# --- S4 : essais limités, sessions inactives fermées --------------------------
# 3 essais par connexion (maximum imposé : 4) ; fail2ban bannit ensuite l'adresse.
MaxAuthTries 3
# 30 s pour s'authentifier : limite les connexions laissées ouvertes sans login.
LoginGraceTime 30
# Session sans aucune activité pendant 10 min : fermée (maximum imposé : 15 min).
# ChannelTimeout mesure l'inactivité réelle de la session (aucune donnée échangée).
ChannelTimeout session=10m
UnusedConnectionTimeout 5m
# Client disparu (coupure réseau) : détecté au bout de 3 x 60 s.
# ClientAlive seul ne suffit pas pour S4 : un client vivant répond aux sondes,
# même si personne n'est devant le clavier.
ClientAliveInterval 60
ClientAliveCountMax 3

# --- Réduction de la surface d'attaque (ANSSI, usage sécurisé d'OpenSSH) ------
X11Forwarding no
AllowTcpForwarding no
PermitTunnel no
PermitUserEnvironment no
# Redirection d'agent refusée par défaut, autorisée plus bas pour les admins
# seulement (ils s'en servent pour git pull depuis la VM).
AllowAgentForwarding no

# --- Contexte C : groupe invite en SFTP seulement, enfermé dans /srv ----------
# - ForceCommand internal-sftp : aucune commande ni shell possible, même si le
#   client en demande un (en plus du shell nologin donné par creer_comptes.sh) ;
# - ChrootDirectory /srv : l'invité ne voit pas le reste du système. /srv doit
#   appartenir à root et ne pas être modifiable par d'autres (755) ;
# - -d /publications : dossier d'arrivée, le seul que les ACL lui laissent lire.
Match Group invite
    ForceCommand internal-sftp -d /publications
    ChrootDirectory /srv
    PermitTTY no
    AllowAgentForwarding no

Match Group admins
    AllowAgentForwarding yes

# Fin des blocs Match : toute ligne lue après (fin de sshd_config) redevient globale.
Match all
