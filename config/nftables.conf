#!/usr/sbin/nft -f
#
# /etc/nftables.conf - Exigence J2
# Copié par installer.sh, chargé à chaque démarrage par nftables.service.
#
# Pas de "flush ruleset" (présent dans le fichier Debian d'origine) : il effacerait
# aussi la table de fail2ban (inet f2b-table) à chaque rechargement, et toutes les
# adresses bannies seraient débloquées. On ne remplace que NOTRE table : la première
# ligne la crée si elle n'existe pas, la deuxième la supprime ; le fichier peut donc
# être rechargé autant de fois qu'on veut, sans erreur et sans toucher à fail2ban.
table inet filtre {}
delete table inet filtre

# "inet" : une seule table pour IPv4 et IPv6
table inet filtre {
    chain entree {
        # Tout ce qui entre est refusé par défaut
        type filter hook input priority filter; policy drop;

        # Réponses aux connexions déjà établies (apt, DNS, sessions SSH en cours...)
        ct state established,related accept
        ct state invalid drop

        # Trafic de la machine vers elle-même (interface lo)
        iif "lo" accept

        # IPv6 ne fonctionne pas sans découverte des voisins et annonces du routeur
        icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert } accept

        # SSH : le seul service joignable
        tcp dport 22 ct state new accept

        # Le reste tombe dans la politique drop ; on en garde une trace, limitée
        # à 5 lignes par minute pour qu'un scan ne sature pas le journal
        limit rate 5/minute log prefix "nft-refus: " level info
    }

    chain transfert {
        # La VM n'est pas un routeur : rien ne la traverse
        type filter hook forward priority filter; policy drop;
    }

    chain sortie {
        # Sorties autorisées (mises à jour, DNS, git...)
        type filter hook output priority filter; policy accept;
    }
}
