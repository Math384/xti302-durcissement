# /etc/fail2ban/jail.d/xti302.conf - Exigence J1 (copié par installer.sh)
#
# Les fichiers de jail.d sont lus par ordre alphabétique et la dernière valeur
# l'emporte : ce fichier passe après defaults-debian.conf fourni par le paquet.

[DEFAULT]
# Debian 13 minimale : pas de /var/log/auth.log, les journaux SSH sont dans journald
backend = systemd
# Bannissement par nftables, dans sa propre table (inet f2b-table), séparée de la nôtre
banaction = nftables-multiport
banaction_allports = nftables-allports
# Ne jamais bannir la machine elle-même
ignoreself = true
ignoreip = 127.0.0.1/8 ::1

[sshd]
enabled  = true
port     = ssh
# aggressive : compte aussi les échecs sans mot de passe (clé refusée, compte
# hors de acces_ssh, déconnexion avant authentification...), seuls possibles ici
# puisque l'authentification par mot de passe est désactivée (S1)
mode     = aggressive
# 5 échecs en 10 minutes depuis une même adresse : 10 minutes de bannissement
maxretry = 5
findtime = 10m
bantime  = 10m
# Récidive : la durée double à chaque nouveau bannissement, jusqu'à 1 jour
bantime.increment = true
bantime.maxtime   = 1d
